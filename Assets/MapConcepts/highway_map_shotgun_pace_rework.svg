<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800">
  <defs>
    <style>
      .bg { fill: #242424; }
      .panel { fill: #1b1b1b; stroke: #eeeeee; stroke-width: 3; }
      .solid { fill: #eeeeee; }
      .cut { fill: #242424; }
      .cover { fill: #ffffff; opacity: 0.13; stroke: #ffffff; stroke-width: 2; }
      .hazard { fill: #ff4545; opacity: 0.16; stroke: #ff7373; stroke-width: 2; }
      .boost { fill: #ffd447; opacity: 0.2; stroke: #ffd447; stroke-width: 2; }
      .route { fill: none; stroke: #ffd447; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .loop { fill: none; stroke: #ffb347; stroke-width: 5; stroke-dasharray: 15 10; stroke-linecap: round; }
      .close { fill: none; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 8 8; opacity: 0.65; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 27px; font-weight: bold; }
      .label { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 16px; }
      .small { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 13px; }
      .note { fill: #cccccc; font-family: Arial, sans-serif; font-size: 14px; }
      .mg { fill: #e83333; stroke: #ffffff; stroke-width: 3; }
      .rifle { fill: #2e7dff; stroke: #ffffff; stroke-width: 3; }
      .sniper { fill: #23b84f; stroke: #ffffff; stroke-width: 3; }
      .player { fill: #ffd447; stroke: #ffffff; stroke-width: 2; }
      .pad { fill: #ffd447; stroke: #ffffff; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd447"/>
    </marker>
    <g id="legend">
      <circle class="mg" cx="0" cy="0" r="12"/><text class="small" x="22" y="5">MG: short burst blocker, never long lane</text>
      <circle class="rifle" cx="275" cy="0" r="12"/><text class="small" x="297" y="5">Rifle: close chaser / corner pop</text>
      <circle class="sniper" cx="535" cy="0" r="12"/><text class="small" x="557" y="5">Sniper: brief warning, angle changer</text>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1800"/>
  <text class="title" x="40" y="50">Shotgun-Pace Highway Rework</text>
  <text class="note" x="40" y="78">Goal: force close-range pushes. Short lanes, curved entries, drop-ins, jump pads, breakable blockers, and enemy positions within shotgun approach distance.</text>
  <g transform="translate(805 60)"><use href="#legend"/></g>

  <!-- 1. Broken sprint ramp -->
  <g transform="translate(40 115)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">1. Broken Road: Sprint Ramp</text>
    <text class="note" x="24" y="68">Replace long first contact with a forced rush over broken slabs.</text>
    <rect class="solid" x="35" y="365" width="130" height="22"/>
    <polygon class="solid" points="190,390 285,345 285,367 192,412"/>
    <polygon class="solid" points="330,358 432,315 432,337 332,380"/>
    <rect class="solid" x="475" y="365" width="220" height="22"/>
    <rect class="boost" x="178" y="350" width="92" height="42" rx="5"/>
    <rect class="boost" x="314" y="322" width="100" height="42" rx="5"/>
    <rect class="cover" x="66" y="330" width="54" height="35" rx="3"/>
    <rect class="cover" x="504" y="333" width="62" height="32" rx="3"/>
    <polygon class="hazard" points="286,345 328,358 328,386 286,367"/>
    <path class="route" marker-end="url(#arrow)" d="M58 352 C132 347 176 374 226 374 C280 374 305 335 373 334 C430 334 470 354 536 354 C595 354 635 348 675 335"/>
    <path class="loop" d="M116 332 C188 272 301 276 372 322"/>
    <circle class="player" cx="58" cy="352" r="13"/>
    <circle class="rifle" cx="230" cy="326" r="15"/>
    <circle class="rifle" cx="512" cy="318" r="15"/>
    <circle class="mg" cx="640" cy="318" r="17"/>
    <path class="close" d="M230 326 L188 374 M512 318 L472 354 M640 318 L596 350"/>
    <text class="small" x="170" y="430">jump/slope momentum keeps shotgun range forced</text>
    <text class="small" x="492" y="405">MG only covers final 1-second push</text>
  </g>

  <!-- 2. Low overpass underside -->
  <g transform="translate(825 115)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">2. Overpass: Underpass Weave</text>
    <text class="note" x="24" y="68">Player moves under/through supports instead of trading shots across a flat lane.</text>
    <rect class="solid" x="45" y="370" width="645" height="22"/>
    <rect class="solid" x="65" y="190" width="610" height="22"/>
    <rect class="solid" x="118" y="212" width="20" height="158"/>
    <rect class="solid" x="250" y="212" width="20" height="158"/>
    <rect class="solid" x="392" y="212" width="20" height="158"/>
    <rect class="solid" x="534" y="212" width="20" height="158"/>
    <rect class="cover" x="80" y="337" width="74" height="33" rx="3"/>
    <rect class="cover" x="222" y="337" width="74" height="33" rx="3"/>
    <rect class="cover" x="364" y="337" width="74" height="33" rx="3"/>
    <rect class="cover" x="506" y="337" width="74" height="33" rx="3"/>
    <rect class="boost" x="170" y="330" width="58" height="40" rx="5"/>
    <rect class="boost" x="455" y="330" width="58" height="40" rx="5"/>
    <polygon class="hazard" points="300,338 363,338 363,370 300,370"/>
    <polygon class="hazard" points="580,338 654,338 654,370 580,370"/>
    <path class="route" marker-end="url(#arrow)" d="M62 354 C120 354 155 346 196 344 C240 342 276 356 320 356 C365 356 403 344 484 344 C555 344 604 354 670 350"/>
    <path class="loop" d="M116 334 C170 275 230 270 256 334 M394 334 C450 276 518 274 540 334"/>
    <circle class="player" cx="62" cy="354" r="13"/>
    <circle class="rifle" cx="198" cy="310" r="15"/>
    <circle class="rifle" cx="340" cy="310" r="15"/>
    <circle class="mg" cx="612" cy="312" r="17"/>
    <path class="close" d="M198 310 L170 344 M340 310 L316 356 M612 312 L576 350"/>
    <text class="small" x="90" y="414">supports become slalom gates, not cover shooting spots</text>
    <text class="small" x="456" y="414">final burst blocker makes player commit</text>
  </g>

  <!-- 3. Two-floor crash house -->
  <g transform="translate(40 660)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">3. 2F Building: Breach Loop</text>
    <text class="note" x="24" y="68">Do not let the player stand outside. Add breach windows, drop floor, and close exits.</text>
    <rect class="solid" x="52" y="370" width="642" height="22"/>
    <rect class="solid" x="220" y="165" width="270" height="205"/>
    <rect class="solid" x="190" y="148" width="330" height="20"/>
    <rect class="cut" x="245" y="212" width="52" height="48"/>
    <rect class="cut" x="352" y="212" width="52" height="48"/>
    <rect class="cut" x="435" y="310" width="44" height="60"/>
    <rect class="cut" x="255" y="310" width="58" height="60"/>
    <rect class="solid" x="230" y="275" width="250" height="12"/>
    <rect class="boost" x="142" y="337" width="70" height="33" rx="5"/>
    <rect class="boost" x="518" y="337" width="70" height="33" rx="5"/>
    <polygon class="hazard" points="315,288 430,288 430,370 315,370"/>
    <path class="route" marker-end="url(#arrow)" d="M70 352 C132 350 166 334 196 296 C230 252 286 236 350 238 C420 240 460 295 508 330 C550 360 606 354 668 345"/>
    <path class="loop" d="M90 350 C160 410 285 412 356 358 C425 306 474 310 560 352"/>
    <circle class="player" cx="70" cy="352" r="13"/>
    <circle class="rifle" cx="278" cy="282" r="15"/>
    <circle class="rifle" cx="420" cy="282" r="15"/>
    <circle class="mg" cx="362" cy="335" r="17"/>
    <circle class="sniper" cx="458" cy="135" r="15"/>
    <path class="close" d="M278 282 L246 252 M420 282 L458 330 M362 335 L352 372"/>
    <text class="small" x="232" y="418">window breach route keeps range short</text>
    <text class="small" x="386" y="120">sniper is a reposition cue, not a duel target</text>
  </g>

  <!-- 4. Container pinball -->
  <g transform="translate(825 660)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">4. Containers: Pinball Lanes</text>
    <text class="note" x="24" y="68">Dense and close. Every visible enemy should be reachable in one or two dashes.</text>
    <rect class="solid" x="44" y="370" width="650" height="22"/>
    <rect class="solid" x="88" y="315" width="95" height="55"/>
    <rect class="solid" x="215" y="270" width="92" height="100"/>
    <rect class="solid" x="345" y="315" width="110" height="55"/>
    <rect class="solid" x="495" y="255" width="92" height="115"/>
    <rect class="boost" x="184" y="338" width="45" height="32" rx="5"/>
    <rect class="boost" x="455" y="338" width="45" height="32" rx="5"/>
    <rect class="cover" x="76" y="305" width="118" height="67" rx="3"/>
    <rect class="cover" x="332" y="305" width="138" height="67" rx="3"/>
    <polygon class="hazard" points="225,296 345,318 345,370 225,370"/>
    <polygon class="hazard" points="506,286 635,315 635,370 506,370"/>
    <path class="route" marker-end="url(#arrow)" d="M58 354 C122 350 170 356 206 340 C260 316 300 332 348 352 C404 375 452 352 498 316 C546 278 592 322 670 350"/>
    <path class="loop" d="M112 300 C202 220 350 226 426 300 C498 370 562 386 630 324"/>
    <circle class="player" cx="58" cy="354" r="13"/>
    <circle class="rifle" cx="170" cy="292" r="15"/>
    <circle class="rifle" cx="300" cy="300" r="15"/>
    <circle class="rifle" cx="430" cy="292" r="15"/>
    <circle class="mg" cx="560" cy="300" r="17"/>
    <path class="close" d="M170 292 L206 340 M300 300 L348 352 M430 292 L498 316 M560 300 L592 322"/>
    <text class="small" x="88" y="418">make this feel like chaining shotgun blasts through corners</text>
    <text class="small" x="470" y="418">MG has a short cone, not a long lane</text>
  </g>

  <!-- 5. Watch post crash -->
  <g transform="translate(40 1205)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">5. Watch Post: Crash The Tower</text>
    <text class="note" x="24" y="68">The sniper creates urgency. The answer is to launch into the base, not hide from it.</text>
    <rect class="solid" x="50" y="370" width="640" height="22"/>
    <rect class="solid" x="418" y="130" width="92" height="20"/>
    <rect class="solid" x="430" y="150" width="16" height="220"/>
    <rect class="solid" x="480" y="150" width="16" height="220"/>
    <path class="close" d="M438 168 L488 230 M488 168 L438 230 M438 248 L488 315 M488 248 L438 315"/>
    <rect class="boost" x="165" y="337" width="82" height="33" rx="5"/>
    <rect class="boost" x="530" y="337" width="62" height="33" rx="5"/>
    <rect class="solid" x="95" y="335" width="72" height="35"/>
    <rect class="solid" x="282" y="320" width="78" height="50"/>
    <rect class="solid" x="590" y="335" width="66" height="35"/>
    <polygon class="hazard" points="380,170 540,170 600,370 260,370"/>
    <path class="route" marker-end="url(#arrow)" d="M65 354 C132 350 178 348 215 336 C282 312 335 328 390 348 C456 372 505 350 560 318 C602 294 636 320 672 350"/>
    <path class="loop" d="M140 330 C220 250 340 250 420 320 C480 374 545 375 610 330"/>
    <circle class="player" cx="65" cy="354" r="13"/>
    <circle class="sniper" cx="464" cy="112" r="15"/>
    <circle class="rifle" cx="314" cy="295" r="15"/>
    <circle class="rifle" cx="612" cy="315" r="15"/>
    <circle class="mg" cx="448" cy="330" r="17"/>
    <path class="close" d="M464 112 L390 348 M314 295 L282 328 M448 330 L456 372"/>
    <text class="small" x="120" y="418">tower pressure should make the player accelerate</text>
    <text class="small" x="430" y="95">warning laser / windup recommended</text>
  </g>

  <!-- 6. Bunker breach -->
  <g transform="translate(825 1205)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">6. Bunker: Breach Finish</text>
    <text class="note" x="24" y="68">Finale should be a close breach, not a frontal shootout. Add side launch and inner room.</text>
    <rect class="solid" x="44" y="370" width="652" height="22"/>
    <rect class="solid" x="415" y="260" width="225" height="110"/>
    <polygon class="solid" points="385,260 670,260 630,205 425,205"/>
    <rect class="cut" x="450" y="296" width="50" height="28"/>
    <rect class="cut" x="560" y="296" width="50" height="28"/>
    <rect class="cut" x="505" y="326" width="52" height="44"/>
    <rect class="solid" x="112" y="335" width="76" height="35"/>
    <rect class="solid" x="250" y="320" width="82" height="50"/>
    <rect class="boost" x="190" y="337" width="55" height="33" rx="5"/>
    <rect class="boost" x="348" y="337" width="55" height="33" rx="5"/>
    <polygon class="hazard" points="405,310 640,292 640,370 405,370"/>
    <path class="route" marker-end="url(#arrow)" d="M64 354 C135 350 190 354 226 336 C282 308 320 324 372 354 C420 382 475 344 520 322 C562 302 604 302 640 330"/>
    <path class="loop" d="M98 330 C170 260 280 258 360 318 C428 368 485 362 555 318"/>
    <circle class="player" cx="64" cy="354" r="13"/>
    <circle class="rifle" cx="284" cy="295" r="15"/>
    <circle class="mg" cx="465" cy="282" r="17"/>
    <circle class="mg" cx="585" cy="282" r="17"/>
    <circle class="rifle" cx="545" cy="350" r="15"/>
    <path class="close" d="M284 295 L226 336 M465 282 L420 382 M585 282 L604 302 M545 350 L520 322"/>
    <text class="small" x="100" y="418">two launch points let player breach with momentum</text>
    <text class="small" x="410" y="190">bunker windows should be close-threat tells</text>
  </g>
</svg>
