    <text class="small" x="420" y="116">roof sniper is visible before entry</text>
  </g>

  <!-- 4. Container area -->
  <g transform="translate(825 660)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">4. Container Section</text>
    <text class="note" x="24" y="68">Short sightlines, flanks, ambush pockets, and safe reload corners.</text>
