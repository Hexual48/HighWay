    <rect class="cover" x="108" y="315" width="72" height="30" rx="3"/>
    <rect class="cover" x="327" y="315" width="92" height="30" rx="3"/>
    <rect class="cover" x="548" y="315" width="82" height="30" rx="3"/>
    <polygon class="hazard" points="188,315 324,315 324,345 188,345"/>
    <polygon class="hazard" points="445,315 545,315 545,345 445,345"/>
    <path class="route" marker-end="url(#arrow)" d="M56 335 C150 335 205 335 274 332 C355 329 430 331 500 334 C565 337 612 336 676 335"/>
    <path class="alt" d="M92 225 C180 214 248 220 328 230 C395 238 475 229 594 224"/>
    <circle class="player" cx="56" cy="335" r="13"/>
    <circle class="rifle" cx="205" cy="205" r="15"/>
    <circle class="mg" cx="380" cy="205" r="17"/>
    <circle class="rifle" cx="535" cy="205" r="15"/>
    <path class="sight" d="M380 205 L180 335"/>
    <path class="sight" d="M535 205 L432 335"/>
    <text class="small" x="95" y="394">supports create stop-and-go cover timing</text>
    <text class="small" x="390" y="394">MG punishes crossing open gaps</text>
  </g>

  <!-- 3. Two-floor building -->
  <g transform="translate(40 660)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">3. Two-Floor Building</text>
    <text class="note" x="24" y="68">Vertical pressure: player chooses street route or interior stairs.</text>
    <rect class="solid" x="58" y="362" width="626" height="22"/>
    <rect class="solid" x="226" y="160" width="246" height="202"/>
    <rect class="solid" x="198" y="146" width="304" height="16"/>
