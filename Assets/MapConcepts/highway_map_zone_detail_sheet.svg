    <polygon class="hazard" points="520,318 650,318 650,365 520,365"/>
    <path class="route" marker-end="url(#arrow)" d="M58 354 C142 356 196 350 244 330 C322 298 377 338 442 348 C515 358 572 350 668 350"/>
    <path class="alt" d="M92 306 C155 250 280 230 363 256 C452 284 506 256 625 276"/>
    <circle class="player" cx="58" cy="354" r="13"/>
    <circle class="rifle" cx="180" cy="292" r="15"/>
    <circle class="rifle" cx="310" cy="248" r="15"/>
    <circle class="mg" cx="470" cy="295" r="17"/>
    <circle class="rifle" cx="605" cy="260" r="15"/>
    <path class="sight" d="M470 295 L330 350"/>
    <path class="sight" d="M605 260 L515 350"/>
    <text class="small" x="88" y="410">containers create crouch-height cover and lane changes</text>
    <text class="small" x="430" y="410">MG controls the final lane</text>
  </g>

  <!-- 5. Watch post -->
  <g transform="translate(40 1205)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">5. Watch Post</text>
    <text class="note" x="24" y="68">Small arena around a tower. Sniper pressure plus close guards below.</text>
    <rect class="solid" x="50" y="365" width="640" height="22"/>
    <rect class="solid" x="414" y="140" width="96" height="20"/>
    <rect class="solid" x="430" y="160" width="14" height="205"/>
