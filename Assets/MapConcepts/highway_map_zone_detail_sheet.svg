<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800">
  <defs>
    <style>
      .bg { fill: #242424; }
      .panel { fill: #1b1b1b; stroke: #eeeeee; stroke-width: 3; }
      .solid { fill: #eeeeee; }
      .cut { fill: #242424; }
      .dim { fill: #bdbdbd; }
      .route { fill: none; stroke: #ffd447; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .alt { fill: none; stroke: #ffb347; stroke-width: 4; stroke-dasharray: 14 10; stroke-linecap: round; }
      .sight { fill: none; stroke: #cfcfcf; stroke-width: 3; stroke-dasharray: 10 9; }
      .thin { fill: none; stroke: #eeeeee; stroke-width: 4; }
      .hazard { fill: #ff4d4d; opacity: 0.25; stroke: #ff7878; stroke-width: 2; }
      .cover { fill: #ffffff; opacity: 0.16; stroke: #ffffff; stroke-width: 2; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 27px; font-weight: bold; }
      .label { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 16px; }
      .small { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 13px; }
      .note { fill: #cccccc; font-family: Arial, sans-serif; font-size: 14px; }
      .mg { fill: #e83333; stroke: #ffffff; stroke-width: 3; }
      .rifle { fill: #2e7dff; stroke: #ffffff; stroke-width: 3; }
      .sniper { fill: #23b84f; stroke: #ffffff; stroke-width: 3; }
      .player { fill: #ffd447; stroke: #ffffff; stroke-width: 2; }
      .door { fill: #111111; stroke: #eeeeee; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd447"/>
    </marker>
    <g id="legend">
      <circle class="mg" cx="0" cy="0" r="12"/><text class="small" x="22" y="5">MG</text>
      <circle class="rifle" cx="82" cy="0" r="12"/><text class="small" x="104" y="5">Rifle</text>
      <circle class="sniper" cx="185" cy="0" r="12"/><text class="small" x="207" y="5">Sniper</text>
      <path class="route" d="M300 0 H365" marker-end="url(#arrow)"/><text class="small" x="382" y="5">Main route</text>
    </g>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1800"/>
  <text class="title" x="40" y="50">Highway Map Detail Sheet</text>
  <text class="note" x="40" y="78">Rough production blockout. White = level geometry, translucent white = cover zone, red tint = danger/exposure.</text>
  <g transform="translate(1040 60)"><use href="#legend"/></g>

  <!-- 1. Collapsed road -->
  <g transform="translate(40 115)">
