    <circle class="rifle" cx="615" cy="326" r="15"/>
    <circle class="sniper" cx="625" cy="180" r="15"/>
    <path class="sight" d="M476 275 L292 336"/>
    <path class="sight" d="M585 275 L380 342"/>
    <path class="sight" d="M625 180 L225 348"/>
    <text class="small" x="420" y="170">optional final sniper or alarm unit</text>
    <text class="small" x="108" y="414">use crates to break bunker sightlines</text>
  </g>
</svg>
