    <circle class="rifle" cx="558" cy="306" r="15"/>
    <circle class="mg" cx="642" cy="325" r="17"/>
    <path class="sight" d="M642 325 L330 392"/>
    <path class="sight" d="M558 306 L260 390"/>
    <text class="small" x="236" y="438">gap forces movement; avoid long idle shooting here</text>
    <text class="small" x="510" y="405">exit cover prepares overpass entry</text>
  </g>

  <!-- 2. Overpass -->
  <g transform="translate(825 115)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">2. Overpass</text>
    <text class="note" x="24" y="68">Long horizontal fire lane with supports as rhythm breaks.</text>
    <rect class="solid" x="42" y="345" width="652" height="22"/>
    <rect class="solid" x="74" y="230" width="545" height="22"/>
    <path class="thin" d="M86 241 H606"/>
