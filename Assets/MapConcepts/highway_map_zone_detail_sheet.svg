    <polygon class="solid" points="280,382 470,305 470,328 282,410"/>
    <rect class="solid" x="495" y="360" width="205" height="22"/>
    <polygon class="hazard" points="225,360 275,382 282,410 220,405"/>
    <rect class="cover" x="72" y="322" width="54" height="38" rx="3"/>
    <rect class="cover" x="145" y="336" width="70" height="24" rx="3"/>
    <rect class="solid" x="83" y="316" width="45" height="10"/>
    <rect class="solid" x="155" y="330" width="62" height="10"/>
    <rect class="solid" x="532" y="328" width="54" height="32"/>
    <rect class="solid" x="600" y="340" width="70" height="20"/>
