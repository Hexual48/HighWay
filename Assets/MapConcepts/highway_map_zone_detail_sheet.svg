    <rect class="cover" x="226" y="314" width="140" height="54" rx="3"/>
    <rect class="cover" x="540" y="328" width="108" height="40" rx="3"/>
    <polygon class="hazard" points="374,220 538,220 666,365 230,365"/>
    <path class="route" marker-end="url(#arrow)" d="M66 352 C150 354 210 350 292 342 C370 335 460 351 520 352 C580 353 622 352 670 350"/>
    <path class="alt" d="M104 324 C200 294 304 292 408 320"/>
    <circle class="player" cx="66" cy="352" r="13"/>
    <circle class="sniper" cx="462" cy="105" r="15"/>
    <circle class="rifle" cx="290" cy="296" r="15"/>
    <circle class="rifle" cx="590" cy="306" r="15"/>
    <circle class="mg" cx="506" cy="330" r="17"/>
    <path class="sight" d="M462 105 L155 352"/>
    <path class="sight" d="M462 105 L620 352"/>
    <text class="small" x="390" y="90">sniper should telegraph before shooting</text>
    <text class="small" x="92" y="414">tower base has enough cover to advance</text>
  </g>

  <!-- 6. Final bunker -->
  <g transform="translate(825 1205)">
    <rect class="panel" x="0" y="0" width="735" height="500" rx="8"/>
    <text class="title" x="24" y="42">6. Final Bunker</text>
