<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <style>
      .bg { fill: #242424; }
      .panel { fill: #1a1a1a; stroke: #eeeeee; stroke-width: 3; }
      .solid { fill: #eeeeee; }
      .cut { fill: #242424; }
      .route { fill: none; stroke: #ffd447; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .alt { fill: none; stroke: #ffb347; stroke-width: 4; stroke-dasharray: 16 10; stroke-linecap: round; }
      .thin { fill: none; stroke: #eeeeee; stroke-width: 3; }
      .cover { fill: #ffffff; opacity: 0.14; stroke: #ffffff; stroke-width: 2; }
      .teach { fill: #ffd447; opacity: 0.18; stroke: #ffd447; stroke-width: 2; }
      .danger { fill: #ff4a4a; opacity: 0.17; stroke: #ff7373; stroke-width: 2; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 30px; font-weight: bold; }
      .head { fill: #ffffff; font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; }
      .label { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 15px; }
      .small { fill: #cccccc; font-family: Arial, sans-serif; font-size: 13px; }
      .mg { fill: #e83333; stroke: #ffffff; stroke-width: 3; }
      .rifle { fill: #2e7dff; stroke: #ffffff; stroke-width: 3; }
      .sniper { fill: #23b84f; stroke: #ffffff; stroke-width: 3; }
      .player { fill: #ffd447; stroke: #ffffff; stroke-width: 2; }
      .gate { fill: #111111; stroke: #eeeeee; stroke-width: 2; }
      .water { fill: #5bb7ff; opacity: 0.16; stroke: #5bb7ff; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd447"/>
    </marker>
  </defs>

  <rect class="bg" width="2200" height="1400"/>
  <text class="title" x="40" y="52">Highway Stage Flow - 3x Scale Rework</text>
  <text class="small" x="40" y="80">Design rule: keep shotgun tempo, but stretch each area into multiple beats. Red = machine gunner, blue = rifleman, green = sniper.</text>

  <!-- Macro route -->
  <rect class="panel" x="40" y="110" width="2120" height="250" rx="8"/>
  <text class="head" x="65" y="145">Overall Pacing</text>
  <path class="route" marker-end="url(#arrow)" d="M95 255 C245 245 330 245 455 252 C615 260 700 235 850 248 C1000 260 1070 270 1215 248 C1370 225 1470 240 1600 252 C1765 267 1870 248 2070 235"/>
  <rect class="teach" x="90" y="185" width="270" height="92" rx="6"/>
  <rect class="teach" x="410" y="185" width="270" height="92" rx="6"/>
  <rect class="teach" x="730" y="185" width="330" height="92" rx="6"/>
  <rect class="teach" x="1110" y="185" width="250" height="92" rx="6"/>
  <rect class="teach" x="1410" y="185" width="300" height="92" rx="6"/>
  <rect class="teach" x="1760" y="185" width="310" height="92" rx="6"/>
  <text class="label" x="120" y="215">1. Broken road</text>
  <text class="small" x="120" y="238">movement tutorial</text>
  <text class="small" x="120" y="258">no real punishment yet</text>
  <text class="label" x="440" y="215">2. Overpass</text>
  <text class="small" x="440" y="238">learn enemy roles</text>
  <text class="small" x="440" y="258">rifle -> MG -> sniper tells</text>
  <text class="label" x="760" y="215">3. 3-floor building</text>
  <text class="small" x="760" y="238">interior combat test</text>
  <text class="small" x="760" y="258">stairs, drops, room breaches</text>
  <text class="label" x="1140" y="215">4. Container gap</text>
  <text class="small" x="1140" y="238">currently undecided</text>
  <text class="small" x="1140" y="258">use as optional variation</text>
  <text class="label" x="1440" y="215">5. Watch posts</text>
  <text class="small" x="1440" y="238">multiple tower clusters</text>
  <text class="small" x="1440" y="258">rush between vertical threats</text>
  <text class="label" x="1790" y="215">6. Bunker + basement</text>
  <text class="small" x="1790" y="238">surface breach then underground</text>
  <text class="small" x="1790" y="258">final close-range gauntlet</text>

  <!-- 1 Broken road tutorial -->
  <g transform="translate(40 400)">
    <rect class="panel" x="0" y="0" width="680" height="390" rx="8"/>
    <text class="head" x="24" y="38">1. Broken Road - Movement Training</text>
    <text class="small" x="24" y="62">3x version: three small movement lessons before enemies become threatening.</text>
    <rect class="solid" x="40" y="305" width="95" height="20"/>
    <polygon class="solid" points="155,325 250,275 250,295 156,345"/>
    <rect class="solid" x="285" y="300" width="90" height="20"/>
    <polygon class="solid" points="405,320 515,265 515,285 407,340"/>
    <rect class="solid" x="545" y="300" width="100" height="20"/>
    <rect class="teach" x="145" y="270" width="115" height="55" rx="5"/>
    <rect class="teach" x="395" y="260" width="130" height="60" rx="5"/>
    <path class="route" marker-end="url(#arrow)" d="M60 292 C125 288 155 315 205 304 C265 292 300 288 340 288 C395 288 425 310 468 298 C520 283 565 286 625 286"/>
    <path class="alt" d="M76 280 C165 210 278 232 350 282"/>
    <circle class="player" cx="60" cy="292" r="12"/>
    <circle class="rifle" cx="575" cy="270" r="14"/>
    <text class="label" x="65" y="355">A. jump gap</text>
    <text class="label" x="240" y="355">B. slope control</text>
    <text class="label" x="435" y="355">C. approach dummy enemy</text>
  </g>

  <!-- 2 Overpass enemy teaching -->
  <g transform="translate(760 400)">
    <rect class="panel" x="0" y="0" width="680" height="390" rx="8"/>
    <text class="head" x="24" y="38">2. Overpass - Enemy Role Tutorial</text>
    <text class="small" x="24" y="62">Three micro arenas: rifleman chase, MG burst blocker, sniper warning angle.</text>
    <rect class="solid" x="45" y="305" width="590" height="20"/>
    <rect class="solid" x="70" y="185" width="535" height="18"/>
    <rect class="solid" x="120" y="203" width="16" height="102"/>
    <rect class="solid" x="260" y="203" width="16" height="102"/>
    <rect class="solid" x="400" y="203" width="16" height="102"/>
    <rect class="solid" x="540" y="203" width="16" height="102"/>
    <rect class="teach" x="75" y="250" width="125" height="55" rx="5"/>
    <rect class="danger" x="270" y="250" width="125" height="55" rx="5"/>
    <rect class="teach" x="455" y="250" width="135" height="55" rx="5"/>
    <path class="route" marker-end="url(#arrow)" d="M62 290 C135 290 175 285 230 285 C300 285 330 292 370 292 C430 292 475 282 535 282 C585 282 610 280 635 274"/>
    <circle class="player" cx="62" cy="290" r="12"/>
    <circle class="rifle" cx="156" cy="235" r="14"/>
    <circle class="mg" cx="335" cy="236" r="16"/>
    <circle class="sniper" cx="550" cy="170" r="14"/>
    <path class="thin" d="M550 170 L488 285"/>
    <text class="label" x="78" y="340">rifle: close pop</text>
    <text class="label" x="275" y="340">MG: burst timing</text>
    <text class="label" x="455" y="340">sniper: warning line</text>
  </g>

  <!-- 3 3-floor building -->
  <g transform="translate(1480 400)">
    <rect class="panel" x="0" y="0" width="680" height="390" rx="8"/>
    <text class="head" x="24" y="38">3. Three-Floor Building - Interior Fight</text>
    <text class="small" x="24" y="62">Expanded from 2F to 3F. Combat should be inside rooms, stairs, and broken floors.</text>
    <rect class="solid" x="45" y="325" width="590" height="20"/>
    <rect class="solid" x="185" y="95" width="310" height="230"/>
    <rect class="solid" x="160" y="78" width="360" height="18"/>
    <rect class="cut" x="218" y="120" width="48" height="38"/>
    <rect class="cut" x="315" y="120" width="48" height="38"/>
    <rect class="cut" x="415" y="120" width="48" height="38"/>
    <rect class="cut" x="218" y="195" width="48" height="38"/>
    <rect class="cut" x="315" y="195" width="48" height="38"/>
    <rect class="cut" x="415" y="195" width="48" height="38"/>
    <rect class="cut" x="218" y="272" width="48" height="53"/>
    <rect class="cut" x="415" y="272" width="48" height="53"/>
    <rect class="solid" x="195" y="172" width="290" height="10"/>
    <rect class="solid" x="195" y="248" width="290" height="10"/>
    <path class="thin" d="M468 325 L500 248 M458 248 L500 182 M455 182 L500 96"/>
    <path class="route" marker-end="url(#arrow)" d="M60 306 C128 302 160 285 198 250 C245 207 290 230 335 236 C395 244 412 192 462 160 C505 132 540 180 596 212"/>
    <path class="alt" d="M82 306 C160 358 282 350 352 294 C425 236 495 260 590 315"/>
    <circle class="player" cx="60" cy="306" r="12"/>
    <circle class="rifle" cx="250" cy="236" r="14"/>
    <circle class="rifle" cx="436" cy="236" r="14"/>
    <circle class="mg" cx="342" cy="288" r="16"/>
    <circle class="sniper" cx="445" cy="70" r="14"/>
    <text class="label" x="200" y="360">interior loop: enter 1F -> fight up -> drop/exit</text>
  </g>

  <!-- 4 Container undecided alternatives -->
  <g transform="translate(40 835)">
    <rect class="panel" x="0" y="0" width="680" height="390" rx="8"/>
    <text class="head" x="24" y="38">4. Container Section - Replace or Reframe</text>
    <text class="small" x="24" y="62">If it stays, it should not be a cover maze. Use one of these roles.</text>
    <rect class="solid" x="45" y="318" width="590" height="20"/>
    <rect class="cover" x="75" y="255" width="105" height="63" rx="4"/>
    <rect class="cover" x="225" y="205" width="100" height="113" rx="4"/>
    <rect class="cover" x="375" y="255" width="110" height="63" rx="4"/>
    <rect class="cover" x="525" y="220" width="80" height="98" rx="4"/>
    <path class="route" marker-end="url(#arrow)" d="M65 302 C140 296 180 306 230 276 C285 242 328 288 382 306 C450 328 500 284 610 300"/>
    <path class="alt" d="M86 245 C185 150 333 160 420 238 C490 300 550 285 615 235"/>
    <circle class="rifle" cx="175" cy="235" r="14"/>
    <circle class="rifle" cx="340" cy="250" r="14"/>
    <circle class="mg" cx="560" cy="205" r="16"/>
    <text class="label" x="55" y="100">Option A: short cooldown/reset zone</text>
    <text class="small" x="55" y="122">fewer enemies, movement playground, ammo pickup</text>
    <text class="label" x="55" y="155">Option B: pinball combat lane</text>
    <text class="small" x="55" y="177">tight corners, enemies reachable in one dash</text>
    <text class="label" x="55" y="210">Option C: remove it</text>
    <text class="small" x="55" y="232">replace with roadwork, tollgate, bus pileup, or parking deck</text>
  </g>

  <!-- 5 Multiple watch posts -->
  <g transform="translate(760 835)">
    <rect class="panel" x="0" y="0" width="680" height="390" rx="8"/>
    <text class="head" x="24" y="38">5. Watch Posts - Multiple Clusters</text>
    <text class="small" x="24" y="62">Good structure. Scale it by chaining 3 towers with different approach shapes.</text>
    <rect class="solid" x="45" y="318" width="590" height="20"/>
    <g transform="translate(85 0)">
      <rect class="solid" x="60" y="175" width="70" height="16"/>
      <rect class="solid" x="72" y="191" width="12" height="127"/>
      <rect class="solid" x="108" y="191" width="12" height="127"/>
      <circle class="sniper" cx="96" cy="160" r="14"/>
      <rect class="cover" x="20" y="285" width="62" height="33" rx="3"/>
    </g>
    <g transform="translate(265 0)">
      <rect class="solid" x="60" y="125" width="70" height="16"/>
      <rect class="solid" x="72" y="141" width="12" height="177"/>
      <rect class="solid" x="108" y="141" width="12" height="177"/>
      <circle class="sniper" cx="96" cy="110" r="14"/>
      <rect class="cover" x="15" y="270" width="70" height="48" rx="3"/>
      <circle class="mg" cx="142" cy="285" r="16"/>
    </g>
    <g transform="translate(465 0)">
      <rect class="solid" x="60" y="195" width="70" height="16"/>
      <rect class="solid" x="72" y="211" width="12" height="107"/>
      <rect class="solid" x="108" y="211" width="12" height="107"/>
      <circle class="sniper" cx="96" cy="180" r="14"/>
      <rect class="cover" x="20" y="285" width="62" height="33" rx="3"/>
      <circle class="rifle" cx="150" cy="286" r="14"/>
    </g>
    <path class="route" marker-end="url(#arrow)" d="M62 304 C145 300 185 284 240 292 C310 303 335 250 405 252 C480 254 520 302 625 295"/>
    <path class="alt" d="M80 286 C160 225 220 225 300 284 C385 348 455 350 570 258"/>
    <text class="label" x="90" y="360">low tower</text>
    <text class="label" x="320" y="360">tall tower + MG base</text>
    <text class="label" x="510" y="360">exit tower</text>
  </g>

  <!-- 6 Bunker + basement -->
  <g transform="translate(1480 835)">
    <rect class="panel" x="0" y="0" width="680" height="390" rx="8"/>
    <text class="head" x="24" y="38">6. Bunker + Basement</text>
    <text class="small" x="24" y="62">Surface breach is only phase one. Basement becomes final shotgun gauntlet.</text>
    <rect class="solid" x="45" y="218" width="590" height="20"/>
    <rect class="solid" x="365" y="120" width="210" height="98"/>
    <polygon class="solid" points="340,120 600,120 568,80 372,80"/>
    <rect class="cut" x="405" y="150" width="48" height="26"/>
    <rect class="cut" x="505" y="150" width="48" height="26"/>
    <rect class="gate" x="465" y="178" width="48" height="40"/>
    <path class="route" marker-end="url(#arrow)" d="M65 202 C150 198 198 206 265 190 C320 176 375 190 430 202 C490 215 535 202 585 178"/>
    <circle class="rifle" cx="280" cy="168" r="14"/>
    <circle class="mg" cx="430" cy="145" r="16"/>
    <circle class="mg" cx="535" cy="145" r="16"/>
    <rect class="water" x="88" y="305" width="498" height="38" rx="5"/>
    <rect class="solid" x="90" y="282" width="110" height="20"/>
    <rect class="solid" x="240" y="250" width="110" height="20"/>
    <rect class="solid" x="395" y="282" width="110" height="20"/>
    <rect class="solid" x="545" y="250" width="70" height="20"/>
    <path class="alt" marker-end="url(#arrow)" d="M130 290 C190 278 210 258 270 258 C335 258 348 290 420 290 C500 290 520 260 595 260"/>
    <circle class="rifle" cx="260" cy="230" r="14"/>
    <circle class="rifle" cx="430" cy="262" r="14"/>
    <circle class="mg" cx="575" cy="230" r="16"/>
    <text class="label" x="75" y="365">basement: low ceiling, pipes, water, close rooms</text>
  </g>

  <!-- Notes -->
  <rect class="panel" x="40" y="1260" width="2120" height="100" rx="8"/>
  <text class="head" x="65" y="1296">Scale Guidance</text>
  <text class="label" x="65" y="1325">3x size should not mean 3x empty walking. Use 3 beats per zone: teach / pressure / reward. Every enemy should either pull the player forward or force a fast route change.</text>
</svg>
