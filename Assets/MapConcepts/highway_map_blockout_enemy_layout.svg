<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <style>
      .bg { fill: #252525; }
      .solid { fill: #eeeeee; }
      .cut { fill: #252525; }
      .thin { stroke: #eeeeee; stroke-width: 4; fill: none; }
      .dash { stroke: #cfcfcf; stroke-width: 3; stroke-dasharray: 12 10; fill: none; }
      .dim { fill: #bdbdbd; }
      .label { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 16px; }
      .small { fill: #eeeeee; font-family: Arial, sans-serif; font-size: 13px; }
      .zone { fill: #ffffff; opacity: 0.13; stroke: #ffffff; stroke-width: 2; }
      .mg { fill: #e83333; stroke: #ffffff; stroke-width: 3; }
      .rifle { fill: #2e7dff; stroke: #ffffff; stroke-width: 3; }
      .sniper { fill: #23b84f; stroke: #ffffff; stroke-width: 3; }
      .start { fill: #ffd447; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="500"/>

  <!-- Ground and given start area silhouette -->
  <rect class="solid" x="0" y="354" width="350" height="18"/>
  <rect class="solid" x="0" y="252" width="178" height="18"/>
  <rect class="solid" x="0" y="252" width="12" height="120"/>
  <rect class="solid" x="78" y="252" width="12" height="120"/>
  <rect class="solid" x="168" y="252" width="10" height="120"/>
  <rect class="solid" x="90" y="318" width="78" height="8"/>
  <rect class="solid" x="116" y="286" width="28" height="16"/>
  <rect class="dim" x="20" y="344" width="16" height="5"/>
  <circle class="dim" cx="48" cy="348" r="4"/>
  <circle class="dim" cx="49" cy="295" r="3"/>
  <polygon class="start" points="250,346 270,358 250,370"/>
  <text class="small" x="202" y="338">START</text>

  <!-- Zone backgrounds -->
  <rect class="zone" x="300" y="302" width="180" height="70" rx="4"/>
  <rect class="zone" x="520" y="248" width="170" height="78" rx="4"/>
  <rect class="zone" x="690" y="190" width="150" height="182" rx="4"/>
  <rect class="zone" x="860" y="292" width="190" height="80" rx="4"/>
  <rect class="zone" x="1100" y="188" width="110" height="184" rx="4"/>
  <rect class="zone" x="1220" y="252" width="160" height="120" rx="4"/>

  <!-- Collapsed highway and trench -->
  <rect class="solid" x="300" y="354" width="82" height="18"/>
  <polygon class="solid" points="430,372 550,318 550,336 430,390"/>
  <rect class="solid" x="390" y="408" width="90" height="14"/>
  <path class="thin" d="M382 372 L410 408 M430 390 L456 408"/>
  <text class="small" x="316" y="395">collapsed road / first contact</text>

  <!-- Elevated road -->
  <rect class="solid" x="540" y="300" width="155" height="18"/>
  <rect class="solid" x="575" y="318" width="14" height="54"/>
  <rect class="solid" x="660" y="318" width="14" height="54"/>
  <path class="dash" d="M552 309 H684"/>
  <text class="small" x="535" y="286">overpass fire lane</text>

  <!-- Mid building -->
  <rect class="solid" x="705" y="234" width="112" height="138"/>
  <rect class="cut" x="730" y="260" width="24" height="22"/>
  <rect class="cut" x="770" y="260" width="24" height="22"/>
  <rect class="cut" x="730" y="318" width="24" height="22"/>
  <rect class="cut" x="770" y="318" width="24" height="22"/>
  <rect class="solid" x="686" y="220" width="148" height="14"/>
  <text class="small" x="704" y="205">2F building / crossfire</text>

  <!-- Container yard -->
  <rect class="solid" x="850" y="354" width="210" height="18"/>
  <rect class="solid" x="875" y="324" width="72" height="30"/>
  <rect class="solid" x="948" y="292" width="82" height="30"/>
  <rect class="solid" x="970" y="324" width="72" height="30"/>
  <path class="thin" d="M890 324 v30 M910 324 v30 M930 324 v30 M965 292 v30 M988 292 v30 M1012 292 v30"/>
  <text class="small" x="875" y="395">container cover maze</text>

  <!-- Watchtower -->
  <rect class="solid" x="1130" y="214" width="66" height="14"/>
  <rect class="solid" x="1140" y="228" width="10" height="126"/>
  <rect class="solid" x="1176" y="228" width="10" height="126"/>
  <path class="thin" d="M1145 235 L1181 280 M1181 235 L1145 280 M1145 286 L1181 332 M1181 286 L1145 332"/>
  <rect class="solid" x="1110" y="354" width="112" height="18"/>
  <text class="small" x="1115" y="190">sniper tower</text>

  <!-- Final bunker -->
  <rect class="solid" x="1232" y="306" width="128" height="66"/>
  <rect class="solid" x="1210" y="354" width="178" height="18"/>
  <rect class="cut" x="1260" y="328" width="28" height="18"/>
  <rect class="cut" x="1310" y="328" width="28" height="18"/>
  <polygon class="solid" points="1222,306 1368,306 1348,276 1242,276"/>
  <text class="small" x="1244" y="260">final bunker</text>

  <!-- Suggested player route -->
  <path d="M255 360 C345 360 390 360 430 384 C504 342 535 308 612 309 C675 309 706 362 756 362 C829 362 868 348 945 336 C1025 322 1082 356 1158 356 C1230 356 1275 348 1326 338" fill="none" stroke="#ffd447" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <text class="small" x="590" y="430">yellow line = recommended player flow</text>

  <!-- Enemy placement circles -->
  <circle class="rifle" cx="340" cy="336" r="15"/>
  <circle class="rifle" cx="448" cy="378" r="15"/>
  <circle class="rifle" cx="590" cy="280" r="15"/>
  <circle class="mg" cx="675" cy="282" r="17"/>
  <circle class="sniper" cx="780" cy="214" r="15"/>
  <circle class="mg" cx="742" cy="330" r="17"/>
  <circle class="rifle" cx="910" cy="308" r="15"/>
  <circle class="rifle" cx="990" cy="342" r="15"/>
  <circle class="mg" cx="1020" cy="276" r="17"/>
  <circle class="sniper" cx="1164" cy="198" r="15"/>
  <circle class="rifle" cx="1250" cy="338" r="15"/>
  <circle class="mg" cx="1326" cy="328" r="17"/>

  <!-- Sightline hints -->
  <path class="dash" d="M675 282 L505 365"/>
  <path class="dash" d="M780 214 L610 318"/>
  <path class="dash" d="M1164 198 L980 342"/>
  <path class="dash" d="M1326 328 L1212 352"/>

  <!-- Legend -->
  <rect x="20" y="20" width="318" height="118" rx="6" fill="#171717" stroke="#eeeeee" stroke-width="2"/>
  <text class="label" x="38" y="48">Enemy placement legend</text>
  <circle class="mg" cx="52" cy="76" r="12"/>
  <text class="small" x="74" y="81">Red: machine gunner</text>
  <circle class="rifle" cx="52" cy="101" r="12"/>
  <text class="small" x="74" y="106">Blue: rifleman</text>
  <circle class="sniper" cx="52" cy="126" r="12"/>
  <text class="small" x="74" y="131">Green: sniper</text>

  <text class="label" x="945" y="40">Rough side-view blockout based on the provided start point</text>
  <text class="small" x="945" y="65">Intent: escalating pressure, alternating cover, vertical threats, final bunker holdout</text>
</svg>
